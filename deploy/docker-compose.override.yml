services:
  openclaw:
    environment:
      JOB_SCOUT_WEB_APPLY_URL: http://job-scout-browser:8787/apply
      JOB_SCOUT_BROWSER_TOKEN: ${JOB_SCOUT_BROWSER_TOKEN:-}
    volumes:
      # Developer-owned source/context. Staged into ~/openclaw-deploy/live-source
      # because snap Docker cannot reliably read hidden home directories.
      - ./live-source/workspace:/home/joseph/.openclaw/workspace:ro

      # Run the current entrypoint, which only chowns mutable paths and skips the
      # read-only workspace mount above. The image may have an older baked
      # entrypoint that blanket-chowns the whole tree and would crash on :ro.
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro

      # Public-agent writable DATA areas. Host bind-mounts (not named volumes) so
      # the data is editable in exactly one place — the ~/projects/genaebot checkout
      # — and stays live to the container. These subdirs are gitignored; the sources
      # are non-hidden so snap Docker can read them.
      - /home/joseph/projects/genaebot/agent-workspace:/home/joseph/.openclaw/agent-workspace
      - /home/joseph/projects/genaebot/runtime:/home/joseph/.openclaw/runtime

      # Public-agent context files mounted read-only inside its writable workspace.
      - ./live-source/workspace/AGENTS.md:/home/joseph/.openclaw/agent-workspace/AGENTS.md:ro
      - ./live-source/workspace/TOOLS.md:/home/joseph/.openclaw/agent-workspace/TOOLS.md:ro
      - ./live-source/workspace/SOUL.md:/home/joseph/.openclaw/agent-workspace/SOUL.md:ro
      - ./live-source/workspace/HEARTBEAT.md:/home/joseph/.openclaw/agent-workspace/HEARTBEAT.md:ro
      - ./live-source/workspace/IDENTITY.md:/home/joseph/.openclaw/agent-workspace/IDENTITY.md:ro
      - ./live-source/workspace/MEMORY.md:/home/joseph/.openclaw/agent-workspace/MEMORY.md:ro
      - ./live-source/workspace/README.md:/home/joseph/.openclaw/agent-workspace/README.md:ro
      - ./live-source/workspace/USER.md:/home/joseph/.openclaw/agent-workspace/USER.md:ro
      - ./live-source/agent-workspace/COMMANDS.md:/home/joseph/.openclaw/agent-workspace/COMMANDS.md:ro

  job-scout-browser:
    profiles:
      - job-scout
    build:
      context: ./live-source
      dockerfile: deploy/job-scout-browser.Dockerfile
    image: genaie-job-scout-browser:1.0.0
    restart: unless-stopped
    environment:
      JOB_SCOUT_BROWSER_PORT: "8787"
      JOB_SCOUT_BROWSER_TOKEN: ${JOB_SCOUT_BROWSER_TOKEN:-}
    # Match the host owner of runtime/job-scout so the worker can read private
    # CV and generated cover-letter files without making them world-readable.
    user: ubuntu
    read_only: true
    cap_drop:
      - ALL
    shm_size: 1gb
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000,mode=1770
    volumes:
      - /home/joseph/projects/genaebot/runtime/job-scout:/home/joseph/.openclaw/runtime/job-scout:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s

  job-scout-channel-listener:
    profiles:
      - job-scout-channel
    build:
      context: ./live-source
      dockerfile: deploy/job-scout-channel-listener.Dockerfile
    image: genaie-job-scout-channel-listener:1.0.0
    restart: unless-stopped
    environment:
      JOB_SCOUT_CHANNELS_JSON: '[{"inviteCode":"0029VaYITFn2v1IsGm9zxP1k","expectedName":"ZimLinks","source":"zimlinks-whatsapp"},{"inviteCode":"0029VaQ9LFe8PgsLScuJES32","expectedName":"ZIM•JOB•VACANCIES","source":"zim-job-vacancies-whatsapp"},{"inviteCode":"0029VacRRi9GE56qqFobOZ2K","expectedName":"EveryDayVacancies","source":"everyday-vacancies-whatsapp"}]'
      JOB_SCOUT_CHANNEL_BACKFILL_COUNT: "10"
      JOB_SCOUT_CHANNEL_MAX_MEDIA_BYTES: "26214400"
    user: node
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,uid=1000,gid=1000,mode=1770
    volumes:
      - /home/joseph/projects/genaebot/runtime/job-scout-channel:/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
