services:
  openclaw:
    volumes:
      # Developer-owned source/context. Staged into ~/openclaw-deploy/live-source
      # because snap Docker cannot reliably read hidden home directories.
      - ./live-source/workspace:/home/joseph/.openclaw/workspace:ro

      # Public-agent writable areas.
      - openclaw-agent-workspace:/home/joseph/.openclaw/agent-workspace
      - openclaw-runtime-state:/home/joseph/.openclaw/runtime

      # Public-agent context files mounted read-only inside its writable workspace.
      - ./live-source/workspace/AGENTS.md:/home/joseph/.openclaw/agent-workspace/AGENTS.md:ro
      - ./live-source/workspace/TOOLS.md:/home/joseph/.openclaw/agent-workspace/TOOLS.md:ro
      - ./live-source/workspace/SOUL.md:/home/joseph/.openclaw/agent-workspace/SOUL.md:ro
      - ./live-source/workspace/HEARTBEAT.md:/home/joseph/.openclaw/agent-workspace/HEARTBEAT.md:ro
      - ./live-source/workspace/IDENTITY.md:/home/joseph/.openclaw/agent-workspace/IDENTITY.md:ro
      - ./live-source/workspace/MEMORY.md:/home/joseph/.openclaw/agent-workspace/MEMORY.md:ro
      - ./live-source/workspace/README.md:/home/joseph/.openclaw/agent-workspace/README.md:ro
      - ./live-source/agent-workspace/COMMANDS.md:/home/joseph/.openclaw/agent-workspace/COMMANDS.md:ro

volumes:
  openclaw-agent-workspace:
    name: openclaw-agent-workspace
  openclaw-runtime-state:
    name: openclaw-runtime-state
