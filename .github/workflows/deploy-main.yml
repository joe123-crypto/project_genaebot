name: Validate and deploy OpenClaw production
run-name: OpenClaw ${{ github.sha }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  validate:
    name: Portable validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate workflow definitions
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          rhysd/actionlint:1.7.12

      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            git ls-files -s | awk '$1 == "100755" || $4 ~ /\.sh$/ {print $4}' | while read -r path; do
              if [[ "$path" == *.sh ]] || head -n 1 "$path" | grep -Eq '^#!/usr/bin/env bash$'; then
                printf '%s\n' "$path"
              fi
            done
          )
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --exclude=SC2016 "${files[@]}"

      - name: Run repository validation and tests
        run: ./deploy/ci-check.sh --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"

  secrets:
    name: Secret and private-state scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan tracked source
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          dir /repo --no-banner --redact
