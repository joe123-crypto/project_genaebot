name: Validate and deploy OpenClaw production
run-name: OpenClaw ${{ github.sha }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: Preserve settings, restore baseline, or enable one measured optimization
        type: choice
        options:
          - preserve
          - baseline
          - catalog-trial
          - history-trial
          - allocator-trial
          - sender-trial
          - cache-trial
          - standby-trial
        default: preserve

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  validate:
    name: Portable validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.12.1"

      - name: Validate workflow definitions
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          rhysd/actionlint:1.7.12

      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            git ls-files -s | awk '$1 == "100755" || $4 ~ /\.sh$/ {print $4}' | while read -r path; do
              if [[ "$path" == *.sh ]] || head -n 1 "$path" | grep -Eq '^#!/usr/bin/env bash$'; then
                printf '%s\n' "$path"
              fi
            done
          )
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --exclude=SC2016 "${files[@]}"

      - name: Run repository validation and tests
        run: ./deploy/ci-check.sh --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"

  secrets:
    name: Secret and private-state scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan tracked source
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          dir /repo --no-banner --redact

  compatibility:
    name: Installed runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build the pinned production runtime
        run: docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -f deploy/railway/Dockerfile -t genaebot:ci .
      - name: Fetch the pinned WhatsApp adapter for offline compatibility
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whatsapp-adapter"
          docker run --rm --entrypoint /bin/bash \
            -v "$RUNNER_TEMP/whatsapp-adapter:/adapter" genaebot:ci -lc '
              set -euo pipefail
              npm pack @openclaw/whatsapp@2026.9.9 --ignore-scripts --fetch-retries=1 --fetch-timeout=30000 --pack-destination /adapter
              tar -xzf /adapter/openclaw-whatsapp-2026.9.9.tgz -C /adapter
            '
      - name: Exercise the installed SDK, real catalog workers and SQLite
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint /bin/bash \
            -v "$PWD:/repo:ro" -w /repo \
            -v "$RUNNER_TEMP/whatsapp-adapter/package:/whatsapp-adapter:ro" \
            -e GENAIE_REQUIRE_INTEGRATION=1 \
            -e GENAIE_OPENCLAW_ROOT=/usr/local/lib/node_modules/openclaw \
            -e GENAIE_WHATSAPP_ROOT=/whatsapp-adapter \
            genaebot:ci -lc '
              set -euo pipefail
              node -e '\''if(process.versions.node !== "26.12.1") process.exit(1); const {DatabaseSync}=require("node:sqlite");const d=new DatabaseSync(":memory:");d.prepare("select 1").get();d.close();'\''
              python3 /usr/local/bin/patch-worker-idle.py /usr/local/lib/node_modules/openclaw --check
              python3 /usr/local/bin/patch-history-idle.py /usr/local/lib/node_modules/openclaw --check
              python3 deploy/test_gateway_standby_runtime.py
              node --test --test-reporter=tap deploy/railway/whatsapp-lid-recovery.test.mjs \
                deploy/railway/whatsapp-health-audit.test.mjs \
                deploy/railway/whatsapp-group-discovery.test.mjs \
                deploy/railway/whatsapp-group-activity.test.mjs \
                deploy/railway/whatsapp-group-discovery.integration.test.mjs \
                deploy/railway/whatsapp-dm-policy.integration.test.mjs \
                deploy/railway/whatsapp-cache-cleanup.test.mjs \
                deploy/railway/campaign-sdk.integration.test.mjs \
                deploy/railway/console-accounts.integration.test.mjs \
                deploy/railway/worker-idle.integration.test.mjs \
                deploy/railway/history-idle.integration.test.mjs \
                deploy/railway/catalog-recovery.integration.test.mjs
            ' | tee "$RUNNER_TEMP/runtime-compatibility.tap"
          test "$(sed -n 's/^# skipped //p' "$RUNNER_TEMP/runtime-compatibility.tap" | tail -1)" = "0"
      - name: Retain compatibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-compatibility
          path: ${{ runner.temp }}/runtime-compatibility.tap
          if-no-files-found: ignore

  deploy:
    name: Deploy verified production commit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, secrets, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26.12.1"
      - name: Install pinned Railway CLI
        shell: bash
        timeout-minutes: 5
        run: |
          for attempt in 1 2 3; do
            if npm install --global @railway/cli@5.71.0 && railway --version; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Railway CLI installation failed after 3 attempts"
              exit 1
            fi
            delay=$((attempt * 10))
            echo "::warning::Railway CLI installation failed; retrying in ${delay}s"
            sleep "$delay"
          done
      - name: Release or restore the exact previous image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RELEASE_PROFILE: ${{ inputs.profile || 'preserve' }}
        run: |
          test -n "$RAILWAY_TOKEN"
          python3 deploy/railway-release.py --sha "$GITHUB_SHA" \
            --profile "$RELEASE_PROFILE" --report "$RUNNER_TEMP/railway-release.json"
      - name: Retain release provenance and rollback result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: railway-release
          path: ${{ runner.temp }}/railway-release.json
          if-no-files-found: ignore
