name: Validate and deploy OpenClaw production
run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('Job Scout {0} [{1}]', github.event.client_payload.jobScoutSha, github.event.client_payload.correlationId) || github.event_name == 'workflow_dispatch' && format('Job Scout rollback manifest {0}', inputs.rollback_manifest_hash) || format('OpenClaw {0}', github.sha) }}

on:
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - job_scout_release
  workflow_dispatch:
    inputs:
      rollback_manifest_hash:
        description: SHA-256 of a previously deployed Job Scout release manifest
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  validate:
    name: Portable validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      browser_changed: ${{ steps.changes.outputs.browser_changed }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            workspace/job-scout/package-lock.json
            workspace/job-scout/channel-listener/package-lock.json

      - name: Install locked Node dependencies
        run: |
          npm ci --ignore-scripts --prefix workspace/job-scout
          npm ci --ignore-scripts --prefix workspace/job-scout/channel-listener

      - name: Validate workflow definitions
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          rhysd/actionlint:1.7.12

      - name: Lint shell scripts
        run: |
          mapfile -t files < <(
            git ls-files -s | awk '$1 == "100755" || $4 ~ /\.sh$/ {print $4}' | while read -r path; do
              if [[ "$path" == *.sh ]] || head -n 1 "$path" | grep -Eq '^#!/usr/bin/env bash$'; then
                printf '%s\n' "$path"
              fi
            done
          )
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --exclude=SC2016 "${files[@]}"

      - name: Run repository validation and tests
        run: ./deploy/ci-check.sh --base-sha "$BASE_SHA" --head-sha "$GITHUB_SHA"

      - name: Render Docker Compose configuration
        run: docker compose -f deploy/docker-compose.override.yml config --no-interpolate >/dev/null

      - name: Audit locked Node dependencies
        run: |
          npm --prefix workspace/job-scout audit --omit=dev --audit-level=high
          npm --prefix workspace/job-scout/channel-listener audit --omit=dev --audit-level=high

      - name: Detect browser image changes
        id: changes
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --quiet "$BASE_SHA...$GITHUB_SHA" -- \
            deploy/job-scout-browser.Dockerfile \
            deploy/stage-openclaw-source.sh \
            deploy/stage-workspace.rsync \
            workspace/job-scout/package.json \
            workspace/job-scout/package-lock.json \
            workspace/job-scout/web_apply.mjs \
            workspace/job-scout/web_apply_server.mjs; then
            changed=false
          else
            changed=true
          fi
          printf 'browser_changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"

  secrets:
    name: Secret and private-state scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan tracked source
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.30.1
          dir /repo --no-banner --redact

  browser-image:
    name: Job Scout browser image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build production browser image
        if: needs.validate.outputs.browser_changed == 'true'
        run: |
          stage="$RUNNER_TEMP/live-source"
          ./deploy/stage-openclaw-source.sh "$GITHUB_WORKSPACE" "$stage"
          docker build --file "$stage/deploy/job-scout-browser.Dockerfile" "$stage"

      - name: Report unchanged browser image
        if: needs.validate.outputs.browser_changed != 'true'
        run: echo "Browser image inputs did not change; build skipped."

  job-scout-release:
    name: Validate immutable Job Scout release
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - secrets
      - browser-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate_archive_sha256: ${{ steps.artifact-validation.outputs.candidate_archive_sha256 }}
      correlation_id: ${{ steps.dispatch-request.outputs.correlation_id || steps.rollback-request.outputs.correlation_id }}
      deployment_mode: ${{ steps.dispatch-request.outputs.deployment_mode || steps.rollback-request.outputs.deployment_mode }}
      job_scout_sha: ${{ steps.dispatch-request.outputs.job_scout_sha || steps.rollback-request.outputs.job_scout_sha }}
      manifest_hash: ${{ steps.dispatch-request.outputs.manifest_hash || steps.rollback-request.outputs.manifest_hash }}

    steps:
      - name: Check out receiver source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Parse and validate repository dispatch
        id: dispatch-request
        if: github.event_name == 'repository_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/request"
          python3 deploy/job_scout_release.py parse-dispatch \
            --event "$GITHUB_EVENT_PATH" \
            --genaebot-sha "$GITHUB_SHA" \
            --receiver-run-id "$GITHUB_RUN_ID" \
            --receiver-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --request-out "$RUNNER_TEMP/request/job-scout-deploy-request.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate rollback selector
        id: rollback-selector
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python3 deploy/job_scout_release.py rollback-selector
          --event "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"

      - name: Locate previously deployed release ledger
        id: rollback-ledger
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_NAME: ${{ steps.rollback-selector.outputs.ledger_name }}
          MANIFEST_HASH: ${{ steps.rollback-selector.outputs.manifest_hash }}
        run: |
          gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f "name=$LEDGER_NAME" \
            -f "per_page=100" >"$RUNNER_TEMP/ledger-artifacts.json"
          python3 deploy/job_scout_release.py select-ledger \
            --api-response "$RUNNER_TEMP/ledger-artifacts.json" \
            --manifest-hash "$MANIFEST_HASH" \
            --github-output "$GITHUB_OUTPUT"

      - name: Download previously deployed release ledger
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.rollback-selector.outputs.ledger_name }}
          path: ${{ runner.temp }}/production-ledger
          github-token: ${{ github.token }}
          run-id: ${{ steps.rollback-ledger.outputs.run_id }}

      - name: Build rollback request from production ledger
        id: rollback-request
        if: github.event_name == 'workflow_dispatch'
        env:
          MANIFEST_HASH: ${{ steps.rollback-selector.outputs.manifest_hash }}
        run: |
          mkdir -p "$RUNNER_TEMP/request"
          python3 deploy/job_scout_release.py prepare-rollback \
            --ledger "$RUNNER_TEMP/production-ledger/production-ledger.json" \
            --manifest "$RUNNER_TEMP/production-ledger/job-scout-manifest.json" \
            --manifest-hash "$MANIFEST_HASH" \
            --genaebot-sha "$GITHUB_SHA" \
            --receiver-run-id "$GITHUB_RUN_ID" \
            --receiver-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --request-out "$RUNNER_TEMP/request/job-scout-deploy-request.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR with read-only workflow permission
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull and validate release artifacts on hosted runner
        id: artifact-validation
        env:
          BUNDLE_REF: ${{ steps.dispatch-request.outputs.bundle_ref || steps.rollback-request.outputs.bundle_ref }}
          BROWSER_REF: ${{ steps.dispatch-request.outputs.browser_ref || steps.rollback-request.outputs.browser_ref }}
          LISTENER_REF: ${{ steps.dispatch-request.outputs.listener_ref || steps.rollback-request.outputs.listener_ref }}
        run: >-
          ./deploy/github-actions/validate-job-scout-artifacts.sh
          "$RUNNER_TEMP/request/job-scout-deploy-request.json"
          "$RUNNER_TEMP/job-scout-candidate"
          "$GITHUB_OUTPUT"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

      - name: Upload validated deploy request and bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-scout-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-scout-candidate.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy exact main commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - secrets
      - browser-image
    runs-on:
      - self-hosted
      - linux
      - openclaw-prod
    timeout-minutes: 15
    concurrency:
      group: openclaw-production
      cancel-in-progress: false
    environment: production
    env:
      OPENCLAW_DIR: ${{ github.workspace }}

    steps:
      - name: Check out validated commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check production host memory headroom
        run: ./deploy/check-deploy-resources.sh

      - name: Install locked Node dependencies
        run: |
          npm ci --ignore-scripts --prefix workspace/job-scout
          npm ci --ignore-scripts --prefix workspace/job-scout/channel-listener

      - name: Deploy live container
        run: sudo /usr/local/sbin/openclaw-prod-deploy "$GITHUB_WORKSPACE"

      - name: Record deployed revision
        run: printf "### Production deployment\n\nDeployed \`%s\` to OpenClaw production.\n" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  job-scout-deploy:
    name: Deploy validated Job Scout release
    if: >-
      (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs:
      - job-scout-release
    runs-on:
      - self-hosted
      - linux
      - openclaw-prod
    timeout-minutes: 15
    concurrency:
      group: openclaw-production
      cancel-in-progress: false
    environment: production
    env:
      OPENCLAW_DIR: ${{ github.workspace }}

    steps:
      - name: Check out validated receiver commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download hosted-validated deploy request and bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: job-scout-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-scout-transfer

      - name: Safely extract hosted-validated candidate
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.job-scout-release.outputs.candidate_archive_sha256 }}
        run: |
          archive="$RUNNER_TEMP/job-scout-transfer/job-scout-candidate.tar"
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256" ]
          python3 deploy/job_scout_release.py safe-extract \
            --archive "$archive" \
            --destination "$RUNNER_TEMP/job-scout-candidate"

      - name: Check production host memory headroom
        run: ./deploy/check-deploy-resources.sh

      - name: Apply release through constrained root wrapper
        run: |
          request="$RUNNER_TEMP/job-scout-candidate/job-scout-deploy-request.json"
          bundle="$RUNNER_TEMP/job-scout-candidate/bundle"
          request_hash="$(sha256sum "$request" | awk '{print $1}')"
          sudo /usr/local/sbin/openclaw-prod-deploy \
            "$GITHUB_WORKSPACE" \
            --job-scout-request "$request" "$request_hash" "$bundle"

      - name: Record deployed Job Scout revision
        env:
          CORRELATION_ID: ${{ needs.job-scout-release.outputs.correlation_id }}
          JOB_SCOUT_SHA: ${{ needs.job-scout-release.outputs.job_scout_sha }}
        run: |
          printf '### Job Scout production deployment\n\n' >>"$GITHUB_STEP_SUMMARY"
          printf 'Deployed `%s` with correlation `%s`.\n' \
            "$JOB_SCOUT_SHA" "$CORRELATION_ID" >>"$GITHUB_STEP_SUMMARY"

  record-job-scout-release:
    name: Record production release ledger
    if: >-
      (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
      && needs.job-scout-deploy.result == 'success'
    needs:
      - job-scout-release
      - job-scout-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out receiver source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download deployed request and bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: job-scout-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/job-scout-transfer

      - name: Safely extract deployed candidate
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.job-scout-release.outputs.candidate_archive_sha256 }}
        run: |
          archive="$RUNNER_TEMP/job-scout-transfer/job-scout-candidate.tar"
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256" ]
          python3 deploy/job_scout_release.py safe-extract \
            --archive "$archive" \
            --destination "$RUNNER_TEMP/job-scout-candidate"

      - name: Build production ledger
        run: |
          mkdir "$RUNNER_TEMP/production-ledger"
          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 deploy/job_scout_release.py record-ledger \
            --request "$RUNNER_TEMP/job-scout-candidate/job-scout-deploy-request.json" \
            --recorded-at "$recorded_at" \
            --ledger-out "$RUNNER_TEMP/production-ledger/production-ledger.json"
          install -m 0644 \
            "$RUNNER_TEMP/job-scout-candidate/bundle/job-scout-manifest.json" \
            "$RUNNER_TEMP/production-ledger/job-scout-manifest.json"

      - name: Upload production ledger for hash-only rollback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: job-scout-production-${{ needs.job-scout-release.outputs.manifest_hash }}
          path: ${{ runner.temp }}/production-ledger
          if-no-files-found: error
          retention-days: 90
