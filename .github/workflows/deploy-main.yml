name: Deploy OpenClaw production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: openclaw-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to live container
    runs-on:
      - self-hosted
      - linux
      - openclaw-prod
    timeout-minutes: 15
    env:
      OPENCLAW_DIR: ${{ github.workspace }}

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployable source
        run: ./deploy/validate-openclaw-deploy.sh

      - name: Deploy live container
        run: sudo /usr/local/sbin/openclaw-prod-deploy "$GITHUB_WORKSPACE"
